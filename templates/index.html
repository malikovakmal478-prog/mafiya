<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mafiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="scene">
    <div class="brand">Mafiya</div>

    <div id="loading" class="status">Yuklanmoqda...</div>

    <div id="notJoined" class="hidden status">
      Siz hozircha faol o'yinda emassiz.<br />
      Guruhda <b>/mafia</b> yozib lobbyga qo'shiling.
    </div>

    <div id="cardWrap" class="hidden">
      <div class="card" id="roleCard">
        <div class="card-face card-back">
          <div class="card-mark">M</div>
          <div class="card-hint">Rolingizni ko'rish uchun bosing</div>
        </div>
        <div class="card-face card-front" id="cardFront">
          <div class="role-name" id="roleName">—</div>
          <div class="role-desc" id="roleDesc">—</div>
        </div>
      </div>
      <div class="phase" id="phaseLabel"></div>

      <div class="voice-box">
        <button id="voiceBtn" class="voice-btn">🎙 Ovozli xonaga qo'shilish</button>
        <div class="peers" id="peers"></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
